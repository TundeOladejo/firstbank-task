services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: novawallet
      POSTGRES_USER: novawallet
      POSTGRES_PASSWORD: novawallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novawallet -d novawallet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/NovaWallet.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=novawallet;Username=novawallet;Password=novawallet"
      # Override the dev signing key in a real deployment via a secret.
      Jwt__SigningKey: "dev-only-super-secret-signing-key-change-me-1234567890"
    ports:
      - "8080:8080"
    # Liveness/readiness are exposed at /health/live and /health/ready for orchestrators.
    # No container-level healthcheck here because the aspnet runtime image ships no curl/wget.

volumes:
  pgdata:
